<div class="page-wrapper">
  <div class="page-icon"><span class="material-icons">store</span></div>
  <div class="page-top-bar">
    <div class="title-count">Distributors List ({{ filtered.length }})</div>
    <div class="top-actions">
      <input class="search-input" [(ngModel)]="searchQuery" (ngModelChange)="scheduleSearch()" placeholder="Search anything..."/>
      <button class="btn-add-new"><span class="material-icons">add_circle</span> ADD NEW DISTRIBUTOR</button>
    </div>
  </div>
  <div class="table-card">
    <table class="data-table">
      <thead>
        <tr>
          <th>Action</th>
          <th>Owner Name</th>
          <th>Shop Name</th>
          <th>Mobile</th>
          <th>Beat</th>
          <th>State</th>
          <th>District</th>
          <th>Status</th>
          <th>Active</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let d of filtered">
          <td>
            <div class="action-btns">
              <button class="btn-edit"><span class="material-icons" style="font-size:14px">edit</span></button>
              <button class="btn-view"><span class="material-icons" style="font-size:14px">visibility</span></button>
              <button class="btn-danger" (click)="deleteDistributor(d)"><span class="material-icons" style="font-size:14px">delete</span></button>
              <button class="btn-assign"><span class="material-icons" style="font-size:14px">person_add</span></button>
              <label class="toggle-switch">
                <input type="checkbox" [checked]="d.active" (change)="toggleActive(d)"/>
                <span class="slider"></span>
              </label>
            </div>
          </td>
          <td>{{ d.ownerName }}</td>
          <td>{{ d.shopName }}</td>
          <td>{{ d.mobile }}</td>
          <td>{{ d.beat }}</td>
          <td>{{ d.state }}</td>
          <td>{{ d.district }}</td>
          <td><span class="badge-pending">{{ d.status }}</span></td>
          <td><span class="badge-active">ACTIVE</span></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="page-wrapper">
  <!-- Page Icon + Title Row -->
  <div class="page-title-row">
    <div class="page-icon">
      <span class="material-icons">storefront</span>
    </div>
  </div>

  <div class="page-top-bar">
    <div class="title-count">Retailers List ({{ filteredRetailers.length }})</div>
    <div class="top-actions">
      <input class="search-input" [(ngModel)]="searchQuery" placeholder="Search anything..."/>
      <button class="btn-filter" (click)="toggleFilter()">
        <span class="material-icons">tune</span> FILTER
      </button>
      <button class="btn-add-new" (click)="addNew()">
        <span class="material-icons">add_circle</span> ADD NEW RETAILER
      </button>
    </div>
  </div>

  <!-- Filter Panel -->
  <div class="filter-panel" *ngIf="showFilter">
    <div class="filter-grid">
      <div class="filter-col">
        <label>Owner Name</label>
        <select [(ngModel)]="filterForm.ownerName">
          <option>All Owners</option>
        </select>
      </div>
      <div class="filter-col">
        <label>Shop Name</label>
        <select [(ngModel)]="filterForm.shopName">
          <option>All Shops</option>
        </select>
      </div>
      <div class="filter-col">
        <label>Mobile Number</label>
        <select [(ngModel)]="filterForm.mobileNumber">
          <option>All Mobiles</option>
        </select>
      </div>
      <div class="filter-col">
        <label>Beat</label>
        <select [(ngModel)]="filterForm.beat">
          <option>All Beats</option>
        </select>
      </div>
      <div class="filter-col">
        <label>State</label>
        <select [(ngModel)]="filterForm.state">
          <option>All States</option>
        </select>
      </div>
      <div class="filter-col">
        <label>City</label>
        <select [(ngModel)]="filterForm.city">
          <option>All Cities</option>
        </select>
      </div>
      <div class="filter-col">
        <label>Status</label>
        <select [(ngModel)]="filterForm.status">
          <option>All</option>
          <option>Pending</option>
          <option>Approved</option>
        </select>
      </div>
      <div class="filter-col">
        <label>Active</label>
        <select [(ngModel)]="filterForm.active">
          <option>All</option>
          <option>Active</option>
          <option>Inactive</option>
        </select>
      </div>
      <div class="filter-col">
        <label>Designation</label>
        <select [(ngModel)]="filterForm.designation">
          <option>ASR, DSR</option>
          <option>ASR</option>
          <option>DSR</option>
        </select>
      </div>
      <div class="filter-col">
        <label>Start Date</label>
        <input type="date" [(ngModel)]="filterForm.startDate" placeholder="START DATE"/>
      </div>
      <div class="filter-col">
        <label>End Date</label>
        <input type="date" [(ngModel)]="filterForm.endDate" placeholder="END DATE"/>
      </div>
      <div class="filter-col filter-action-col">
        <button class="btn-icon-round"><span class="material-icons">cloud_download</span></button>
      </div>
    </div>
    <div class="filter-export-row">
      <button class="btn-icon-round"><span class="material-icons">attach_file</span></button>
      <button class="btn-icon-round"><span class="material-icons">cloud_upload</span></button>
      <button class="btn-icon-round"><span class="material-icons">description</span></button>
    </div>
  </div>

  <!-- Table -->
  <div class="table-card">
    <table class="data-table">
      <thead>
        <tr>
          <th>Action</th>
          <th>Owner Name</th>
          <th>Shop Name</th>
          <th>Mobile</th>
          <th>Beat</th>
          <th>State</th>
          <th>District</th>
          <th>Status</th>
          <th>Active</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of filteredRetailers">
          <td>
            <div class="action-btns">
              <button class="btn-edit" (click)="editRetailer(r)" title="Edit">
                <span class="material-icons" style="font-size:14px">edit</span>
              </button>
              <button class="btn-view" (click)="viewRetailer(r)" title="View">
                <span class="material-icons" style="font-size:14px">visibility</span>
              </button>
              <button class="btn-danger" (click)="deleteRetailer(r)" title="Delete">
                <span class="material-icons" style="font-size:14px">delete</span>
              </button>
              <button class="btn-assign" (click)="assignRetailer(r)" title="Assign">
                <span class="material-icons" style="font-size:14px">person_add</span>
              </button>
              <label class="toggle-switch">
                <input type="checkbox" [checked]="r.active" (change)="toggleActive(r)"/>
                <span class="slider"></span>
              </label>
            </div>
          </td>
          <td>{{ r.ownerName }}</td>
          <td>{{ r.shopName }}</td>
          <td>{{ r.mobile }}</td>
          <td>{{ r.beat }}</td>
          <td>{{ r.state }}</td>
          <td>{{ r.district }}</td>
          <td><span class="badge-pending">{{ r.status }}</span></td>
          <td><span class="badge-active">ACTIVE</span></td>
        </tr>
        <tr *ngIf="filteredRetailers.length === 0">
          <td colspan="9" class="empty-row">No retailers found</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="page-wrapper">
  <div class="page-icon-row">
    <div class="page-icon">
      <span class="material-icons">storefront</span>
    </div>
  </div>

  <div class="form-header">
    <h2>Add New Retailer</h2>
    <div class="header-actions">
      <button class="btn-icon-round teal">
        <span class="material-icons">refresh</span>
      </button>
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="retailer-form">

    <div class="form-row">
      <div class="form-col">
        <label>Shop Name <span class="req">*</span></label>
        <input formControlName="shopName" type="text"/>
      </div>
      <div class="form-col">
        <label>Owner Name <span class="req">*</span></label>
        <input formControlName="ownerName" type="text"/>
      </div>
    </div>

    <div class="form-section">
      <div class="section-header-row">
        <label>Mobile Numbers <span class="req">*</span></label>
        <button type="button" class="btn-add-mobile" (click)="addMobile()">
          <span class="material-icons">add</span>
        </button>
      </div>
      <div formArrayName="mobileNumbers">
        <div *ngFor="let ctrl of mobileNumbers.controls; let i = index; trackBy: trackByIndex" class="mobile-row">
          <input [formControlName]="i" type="tel" [placeholder]="'Mobile Number ' + (i+1)" class="mobile-input"/>
          <button type="button" class="btn-remove-mobile" (click)="removeMobile(i)">
            <span class="material-icons">remove</span>
          </button>
        </div>
      </div>
      <p class="hint">You can add up to 5 mobile numbers.</p>
    </div>

    <div class="form-row">
      <div class="form-col">
        <label>Distributor Name <span class="req">*</span></label>
        <select formControlName="distributorName">
          <option value="">SELECT DOMESTIC DISTRIBUTOR</option>
          <option *ngFor="let d of distributors" [value]="d">{{ d | firstCaps }}</option>
        </select>
      </div>
      <div class="form-col">
        <label>Agri Distributor <span class="req">*</span></label>
        <select formControlName="agriDistributor">
          <option value="">SELECT AGRI DISTRIBUTOR</option>
          <option *ngFor="let d of agriDistributors" [value]="d">{{ d | firstCaps }}</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-col">
        <label>Select Employee <span class="req">*</span></label>
        <input formControlName="selectEmployee" type="text"/>
      </div>
      <div class="form-col">
        <label>Beat <span class="req">*</span></label>
        <select formControlName="beat">
          <option value="">SELECT BEAT</option>
          <option *ngFor="let b of beats" [value]="b">{{ b | firstCaps }}</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-col full-width">
        <label>Address Line <span class="req">*</span></label>
        <textarea formControlName="addressLine" rows="3"></textarea>
      </div>
    </div>

    <div class="form-row">
      <div class="form-col">
        <label>State <span class="req">*</span></label>
        <select formControlName="state">
          <option value="">SELECT STATE</option>
          <option *ngFor="let s of states" [value]="s">{{ s | firstCaps }}</option>
        </select>
      </div>
      <div class="form-col">
        <label>District</label>
        <select formControlName="district">
          <option value="">SELECT DISTRICT</option>
          <option *ngFor="let d of districts" [value]="d">{{ d | firstCaps }}</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-col">
        <label>Pincode <span class="req">*</span></label>
        <input formControlName="pincode" type="text"/>
      </div>
      <div class="form-col">
        <label>Belt / Area / Market Name</label>
        <input formControlName="beltAreaMarketName" type="text"/>
      </div>
    </div>

    <div class="form-row">
      <div class="form-col">
        <label>GST Number</label>
        <input formControlName="gstNumber" type="text" placeholder="22AAAAA0000A1Z5"/>
      </div>
      <div class="form-col">
        <label>PAN Number</label>
        <input formControlName="panNumber" type="text" placeholder="AAAAA0000A"/>
      </div>
    </div>

    <div class="form-row">
      <div class="form-col">
        <label>GST Attachment</label>
        <div class="image-upload-box">
          <div class="img-placeholder">
            <span class="material-icons img-icon">image</span>
          </div>
          <button type="button" class="btn-edit-img">
            <span class="material-icons">edit</span>
          </button>
        </div>
      </div>
      <div class="form-col">
        <label>PAN Attachment</label>
        <div class="image-upload-box">
          <div class="img-placeholder">
            <span class="material-icons img-icon">image</span>
          </div>
          <button type="button" class="btn-edit-img">
            <span class="material-icons">edit</span>
          </button>
        </div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-col">
        <label>Bank Account Type</label>
        <select formControlName="bankAccountType">
          <option value="">SELECT ACCOUNT TYPE</option>
          <option *ngFor="let t of bankAccountTypes" [value]="t">{{ t | firstCaps }}</option>
        </select>
      </div>
      <div class="form-col">
        <label>Bank Name</label>
        <input formControlName="bankName" type="text" placeholder="e.g. State Bank of India"/>
      </div>
    </div>

    <div class="form-row">
      <div class="form-col">
        <label>Bank Account Number <span class="opt">(optional)</span></label>
        <input formControlName="bankAccountNumber" type="text" placeholder="Enter Bank Account Number"/>
      </div>
      <div class="form-col">
        <label>Confirm Bank Account Number <span class="opt">(optional)</span></label>
        <input formControlName="confirmBankAccountNumber" type="text" placeholder="Re-type Bank Account Number"/>
      </div>
    </div>

    <div class="form-row">
      <div class="form-col">
        <label>IFSC Code</label>
        <input formControlName="ifscCode" type="text" placeholder="e.g. SBIN0001234"/>
      </div>
      <div class="form-col">
        <label>Account Holder Name</label>
        <input formControlName="accountHolderName" type="text" placeholder="Name as per bank account"/>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
      <button type="submit" class="btn-submit">Submit</button>
    </div>
  </form>
</div>
